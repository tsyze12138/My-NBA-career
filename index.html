function clone(v){return JSON.parse(JSON.stringify(v))}
function rand(a,b){return Math.random()*(b-a)+a}
function rint(a,b){return Math.floor(rand(a,b+1))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function calcOVR(attrs){
 let vals=ATTRS.map(k=>clamp(attrs[k]||50,1,99)).sort((a,b)=>b-a);
 let w=vals[0]*.35+vals[1]*.25+vals[2]*.20+vals[3]*.10+vals[4]*.05+vals[5]*.03+vals[6]*.02;
 return clamp(Math.round(w*1.08+4),60,99);
}

/* =========================
   真实阵容生成器 (仅初始化)
========================= */
function salaryForOVR(ovr){
  const n=Number(ovr)||0;
  if(n<90) return Math.max(2, Math.round((n*0.4 + rint(2,8))/2));
  // OVR 90+ 视为明星球员：年薪严格控制在4000万~7000万美元。
  // 按能力逐步提高，最高不超过7000万美元；数值单位内部仍使用“百万美元”。
  const salary = 40 + (n-90)*3 + rint(-2,2);
  return Math.round(clamp(salary, 40, 70));
}

function formatSalary(salary){
  const n=Math.max(0,Number(salary)||0);
  if(n>=100) return (n/100).toFixed(n%10===0?0:1)+'亿美元';
  if(n>=10) return (n/10).toFixed(n%10===0?0:1)+'千万美元';
  return (n%1===0?n.toFixed(0):n.toFixed(1))+'百万美元';
}

function formatContract(years, annualSalary){
  const y=Math.max(1,Number(years)||1);
  const annual=Math.max(0,Number(annualSalary)||0);
  return `${y}年${formatSalary(annual*y)}`;
}

function normalizeStarSalaries(){
  ALL_TEAMS.forEach(team=>{
    (STATE.teamRosters[team]||[]).forEach(p=>{
      if(Number(p.ovr)>=90){
        p.salary=salaryForOVR(p.ovr);
      }
    });
  });
}

function buildRealRoster(){
  STATE.teamRosters = {};
  ALL_TEAMS.forEach(team => {
    const realData = REAL_ROSTERS[team] || [];
    const roster = realData.map((p, i) => ({
      id: team+'-'+i,
      name: p.name,
      pos: p.pos,
      ovr: clamp(p.ovr + rint(-2,2), 65, 97),
      age: p.age || rint(22,35),
      role: p.role || (i<3?'核心': i<7?'主要轮换':'替补'),
      salary: salaryForOVR(p.ovr),
      isUser: false
    }));
    STATE.teamRosters[team] = roster;
  });
  normalizeStarSalaries();
}

function ensureUserOnRoster(){
  if (Object.keys(STATE.teamRosters).length === 0) {
    buildRealRoster();
  }

  // 强制保证自建球员在全联盟阵容中只存在一份。
  // 无论之前在哪支球队，换队后先从所有旧球队移除，再加入新球队。
  ALL_TEAMS.forEach(team=>{
    const roster=STATE.teamRosters[team]||[];
    STATE.teamRosters[team]=roster.filter(p=>!p.isUser && p.id!=='USER');
  });

  if(!STATE.teamRosters[STATE.userTeam]) STATE.teamRosters[STATE.userTeam]=[];
  STATE.teamRosters[STATE.userTeam].unshift({
    id:'USER',
    name:STATE.playerName,
    pos:STATE.position,
    ovr:STATE.finalOVR,
    age:STATE.age,
    role:'球队核心',
    salary:salaryForOVR(STATE.finalOVR),
    isUser:true
  });  normalizeStarSalaries();
}

// 阵容完整性检查：修复旧存档或历史版本产生的自建球员重复问题。
function normalizeRosters(){
  if(!STATE.teamRosters || Object.keys(STATE.teamRosters).length===0){
    buildRealRoster();
  }
  ALL_TEAMS.forEach(team=>{
    if(!Array.isArray(STATE.teamRosters[team])) STATE.teamRosters[team]=[];
  });
  // 自建球员只允许出现在 STATE.userTeam。
  ALL_TEAMS.forEach(team=>{
    if(team!==STATE.userTeam){
      STATE.teamRosters[team]=STATE.teamRosters[team].filter(p=>!p.isUser && p.id!=='USER');
    }
  });
  ensureUserOnRoster();
}

function rebuildTeamStrengths(){
  ALL_TEAMS.forEach(t=>{
    const roster=STATE.teamRosters[t]||[];
    // 核心规则：球队实力完全等于当前全队球员 OVR 的算术平均值。
    // 包括自建球员、交易后的球员以及后续成长后的球员。
    const strength = roster.length
      ? roster.reduce((sum,p)=>sum+(Number(p.ovr)||0),0) / roster.length
      : (BASE[t] || 75);
    STATE.teamStrengths[t]=+strength.toFixed(1);
  });
}

    const roster=STATE.teamRosters[team]||[];
    const nextRoster=[];

    roster.forEach(player=>{
      if(player.isUser){
        nextRoster.push(player);
        return;
      }

      let age=Math.max(18, Number(player.age)||25);
      let ovr=clamp(Number(player.ovr)||70,1,99);
      const oldAge=age;
      const oldOvr=ovr;

      // 每进入一个新赛季，真实球员年龄+1。
      age += 1;

      let delta=0;

      // 32岁及以下：仍处于发展期，每年都有概率提升。
      // 年龄越小，成长概率越高；31-32岁仍保留成长机会。
      if(age<=32){
        const historicalSuperstar=isHistoricalSuperstar(player);
        // 历史超巨年轻阶段成长略快：提高成长概率，并适度提高+2的出现率，
        // 但仍然限制为小幅逐年成长，避免一两个赛季直接跳到巅峰。
        const baseChance=clamp(0.78-(age-20)*0.018,0.56,0.78);
        const developmentChance=historicalSuperstar
          ? clamp(baseChance+0.10,0.68,0.88)
          : baseChance;
        if(Math.random()<developmentChance && ovr<99){
          delta=historicalSuperstar
            ? (Math.random()<0.68?1:2)
            : (Math.random()<0.82?1:2);
          ovr=clamp(ovr+delta,1,99);
        }
      }
      // 33岁以后：逐年加重的小幅衰退。
      else{
        const yearsOver32=age-32;
        const declineChance=clamp(0.48+yearsOver32*0.045,0.48,0.78);
        if(Math.random()<declineChance){
          // 33-35岁通常掉1点；36岁后逐渐提高出现-2的概率。
          if(age<=35){
            delta=-1;
          }else if(age<=38){
            delta=Math.random()<0.72?-1:-2;
          }else if(age<=40){
            delta=Math.random()<0.55?-1:-2;
          }else{
            delta=Math.random()<0.35?-1:-2;
          }
          ovr=Math.max(1,ovr+delta);
        }
      }

      player.age=age;
      player.ovr=ovr;

      if(delta!==0){
        development.push({
          team,
          name:player.name,
          age,
          oldOvr,
          newOvr:ovr,
          delta
        });
      }

      // 能力值70以下（含70）直接退役，不再进入新赛季阵容。
      if(ovr<=70){
        retirements.push({team,name:player.name,age,ovr});
        return;
      }

      nextRoster.push(player);
    });

    STATE.teamRosters[team]=nextRoster;
  });

  STATE.aiRetirements=retirements;
  STATE.aiDevelopment=development;

  // 让新赛季球队实力立即使用更新后的球员能力值重新计算。
  normalizeStarSalaries();
  rebuildTeamStrengths();

  // 记录少量重要的成长/退役动态，避免新闻过于拥挤。
  retirements.forEach(x=>{
    addNews('球员退役',`${x.name}（${x.age}岁，OVR ${x.ovr}）因能力值降至70以下，从${x.team}退役。`,'退役');
  });
}

/* --------- 修改：增强数据波动 + 爆发机制 + 大前锋盖帽削弱 --------- */
function generateUserGameStats(){
 const base=STATE.finalOVR-65;
 // 普通波动范围加大，更不稳定
 let pts=clamp(rand(8,16) + base * .50, 8, 48);
 let reb, ast, stl, blk;
 const rebBase=STATE.attrs.篮板/10;
 const astBase=STATE.attrs.助攻/9.8;
 const stlBase=STATE.attrs.抢断/40;
 const blkBase=STATE.attrs.盖帽/40;
 // 基础上下浮动幅度加大
 reb = rebBase + (STATE.position==='C'?6: (STATE.position==='SF'||STATE.position==='PF'?1:0)) + rand(-2.5,2.5);
 ast = astBase + rand(-2.2,2.2);
 stl = stlBase + rand(-1.0,1.0);
 
 // ★ 新增：大前锋盖帽削弱系数（PF乘0.7）
 let blkPosMul = 1;
 if (STATE.position === 'PF') blkPosMul = 0.7;
 blk = (blkBase * blkPosMul) + rand(-1.0,1.0);
 
 // ★ 爆发模式：小概率打出疯狂数据
 const burstChance = 0.06;   // 约6%概率
 if (Math.random() < burstChance) {
   const burstType = Math.random(); // 决定侧重
   if (burstType < 0.4) {
     // 得分爆炸
     pts += rand(15, 30);
     reb += rand(2, 6);
     ast += rand(2, 8);
   } else if (burstType < 0.7) {
     // 三双型
     pts += rand(8, 18);
     reb += rand(5, 12);
     ast += rand(6, 12);
   } else {
     // 盖帽/抢断型
     stl += rand(2, 5);
     blk += rand(2, 6);
     pts += rand(5, 15);
   }
 }
 
 return {
   pts: Math.max(2, Math.round(pts)),
   reb: Math.max(0, Math.round(reb)),
   ast: Math.max(0, Math.round(ast)),
   stl: Math.max(0, Math.round(stl)),
   blk: Math.max(0, Math.round(blk))
 };
}

/* --------- 新增：检测爆炸数据并生成事件 --------- */
function maybeAddExplosiveEvent(user, opp, result) {
  if (!user) return;
  const pts = user.pts, reb = user.reb, ast = user.ast, stl = user.stl, blk = user.blk;
  let title = '', detail = '', impact = '';

  // 得分爆炸
  if (pts >= 40) {
    title = `狂砍 ${pts} 分！`;
    detail = `${STATE.playerName} 今晚手感火热，面对 ${opp} 狂砍 ${pts} 分，带领球队${result.win?'取胜':'惜败'}。`;
    impact = `得分 ${pts}，刷新赛季单场新高`;
  }
  // 三双
  else if (pts >= 20 && reb >= 10 && ast >= 10) {
    title = `完成三双！`;
    detail = `${STATE.playerName} 打出全面统治力，砍下 ${pts} 分 ${reb} 篮板 ${ast} 助攻，率队${result.win?'获胜':'战斗至最后一刻'}。`;
    impact = `三双：${pts}分${reb}板${ast}助`;
  }
  // 篮板或助攻大爆发
  else if (reb >= 18) {
    title = `篮板怪兽！`;
    detail = `${STATE.playerName} 抢下 ${reb} 个篮板，彻底统治内线。`;
    impact = `篮板 ${reb} 个`;
  }
  else if (ast >= 15) {
    title = `助攻大师！`;
    detail = `${STATE.playerName} 送出 ${ast} 次助攻，盘活全队进攻。`;
    impact = `助攻 ${ast} 次`;
  }
  // 抢断/盖帽暴走
  else if (stl >= 5 || blk >= 5) {
    title = `防守统治！`;
    detail = `${STATE.playerName} 贡献 ${stl} 抢断 ${blk} 盖帽，让对手进攻受阻。`;
    impact = `抢断${stl} 盖帽${blk}`;
  }

  if (title) {
    const event = {
      type: 'explosive',
      title: title,
      target: STATE.playerName,
      team: STATE.userTeam,
      detail: detail,
      impact: impact,
      game: STATE.gamesPlayed,
      season: STATE.seasonYear
    };
    STATE.eventHistory.unshift(event);
    if (STATE.eventHistory.length > 100) STATE.eventHistory.length = 100;
    // 同时写入新闻流（可选）
    addNews(`${STATE.playerName}：${title}`, `${detail}（${impact}）`, '高光时刻');
  }
}

function weightedPick(items){
  const total=items.reduce((s,x)=>s+x.weight,0); let r=Math.random()*total;
  for(const x of items){r-=x.weight;if(r<=0)return x;} return items[items.length-1];
}
function getAllAIPlayers(){
  const out=[];
  ALL_TEAMS.forEach(team=>{
    (STATE.teamRosters[team]||[]).forEach(p=>{if(!p.isUser)out.push({team,player:p});});
  });
  return out;
}
function activePlayerCount(team){
  return (STATE.teamRosters[team]||[]).filter(p=>!p.isUser && (!p.injury||p.injury.gamesOut<=0)).length + (team===STATE.userTeam && STATE.userInjury.gamesOut<=0 ? 1:0);
}
function teamGameStrength(team){
  const base=STATE.teamStrengths[team] || 75;
  const roster=STATE.teamRosters[team]||[];
  let penalty=0;
  roster.forEach(p=>{
    if(p.isUser) return;
    if(p.injury && p.injury.gamesOut>0) penalty += Math.min(2.8, (Number(p.ovr)||70)*0.018);
  });
  if(team===STATE.userTeam && STATE.userInjury.gamesOut>0) penalty += Math.min(4.5, STATE.finalOVR*0.035);
  return base-penalty;
}
function makeEventTarget(){
  const all=getAllAIPlayers();
  if(Math.random()<0.55){
    return {isUser:true,team:STATE.userTeam,player:{name:STATE.playerName,ovr:STATE.finalOVR,age:STATE.age,isUser:true}};
  }
  if(!all.length) return {isUser:true,team:STATE.userTeam,player:{name:STATE.playerName,ovr:STATE.finalOVR,age:STATE.age,isUser:true}};
  return pick(all);
}
function makeAIOnlyTarget(){ const all=getAllAIPlayers(); if(!all.length) return {isUser:true,team:STATE.userTeam,player:{name:STATE.playerName,ovr:STATE.finalOVR,age:STATE.age,isUser:true}}; return pick(all); }
function prepareSeasonEventSchedule(){
  // 每个赛季随机安排 6~9 场事件，超过5次且少于10次；发生场次完全随机且不重复。
  const validCount = Array.isArray(STATE.seasonEventGames) && STATE.seasonEventGames.length>=6 && STATE.seasonEventGames.length<=9 && STATE.seasonEventGames.every(n=>n>=1&&n<=82);
  if(!validCount){
    const eventCount=rint(6,9);
    STATE.seasonEventGames=shuffle(Array.from({length:82},(_,i)=>i+1)).slice(0,eventCount).sort((a,b)=>a-b);
  }
  if(typeof STATE.seasonEventsTriggered!=='number') STATE.seasonEventsTriggered=0;
  if(typeof STATE.userInjuryEventsThisSeason!=='number') STATE.userInjuryEventsThisSeason=0;
}
function eventScheduledThisGame(){
  prepareSeasonEventSchedule();
  return STATE.seasonEventGames.includes(STATE.gamesPlayed) && STATE.seasonEventsTriggered<STATE.seasonEventGames.length;
}
function randomUserAttribute(){ return pick(ATTRS); }
function applyPositiveEvent(target,event,display){
  if(target.isUser){
    const attr=randomUserAttribute();
    const amount=event.type==='breakthrough' ? (Math.random()<0.82?2:3) : (Math.random()<0.88?1:2);
    const before=Number(STATE.attrs[attr]||50);
    const after=clamp(before+amount,1,99);
    const actual=after-before;
    STATE.attrs[attr]=after;
    STATE.finalOVR=calcOVR(STATE.attrs);
    display.impact=`${attr} +${actual}，OVR ${STATE.finalOVR}`;
    ensureUserOnRoster(); rebuildTeamStrengths();
  }else{
    const attr=randomUserAttribute();
    const amount=event.type==='breakthrough' ? (Math.random()<0.82?2:3) : 1;
    target.player.ovr=clamp((Number(target.player.ovr)||70)+amount,1,99);
    display.impact=`${target.player.name} OVR +${amount}（${attr}专项训练效果）`;
    rebuildTeamStrengths();
  }
}
function triggerRandomGameEvent(){
  if(!eventScheduledThisGame()) return null;
  const target=makeEventTarget();
  if(!target) return null;
  // 自建球员：降低受伤/负面事件权重，提高训练、突破、正面成长事件权重。
  const USER_INJURY_EVENT_TYPES = new Set(['injury','realWeirdInjury','careerAccident','realDanger']);
  const eventPool = target.isUser ? RANDOM_EVENT_TEMPLATES
    .filter(e=>!(USER_INJURY_EVENT_TYPES.has(e.type) && Number(STATE.userInjuryEventsThisSeason||0)>=2))
    .map(e=>{
      let factor=1;
      // 自建球员伤病事件整体低权重；并设置硬上限：每赛季最多2次真正的受伤/事故伤病事件。
      if(USER_INJURY_EVENT_TYPES.has(e.type)) factor=0.22;
      else if(e.type==='discipline') factor=0.7;
      else if(e.type==='training') factor=2.2;
      else if(e.type==='breakthrough') factor=3.0;
      else if(e.type==='realPositive') factor=2.0;
      else if(e.type==='userFun') factor=1.4;
      return {...e, weight:e.weight*factor};
    }) : RANDOM_EVENT_TEMPLATES;
  const event=weightedPick(eventPool);
  const detail=pick(event.details).replaceAll('{PLAYER}', target.player.name);
  const display={type:event.type,title:event.title,detail,target:target.player.name,team:target.team,impact:'',out:0,drop:0,game:STATE.gamesPlayed,season:STATE.seasonYear};
  if(event.type==='training' || event.type==='breakthrough') applyPositiveEvent(target,event,display);
  else if(event.type==='fun') display.impact=target.isUser?'本次事件没有负面影响，反而成为全队热议话题':'没有比赛负面影响，成为球队本周最有趣的花絮';
  else{
    const out=rint(event.minOut,event.maxOut);
    const drop=event.maxDrop>0 ? rint(event.minDrop,event.maxDrop) : 0;
    display.out=out; display.drop=drop;
    if(target.isUser){
      if(USER_INJURY_EVENT_TYPES.has(event.type)) STATE.userInjuryEventsThisSeason=Number(STATE.userInjuryEventsThisSeason||0)+1;
      STATE.userInjury={gamesOut:Math.max(STATE.userInjury.gamesOut||0,out),name:event.title,detail,ovrDrop:drop};
      if(drop>0) STATE.finalOVR=clamp(STATE.finalOVR-drop,60,99);
      display.impact=`${out>0?`休战 ${out} 场`:'无需休战'}${drop>0?`，OVR -${drop}`:''}`;
      ensureUserOnRoster(); rebuildTeamStrengths();
    }else{
      const player=target.player;
      if(out>0) player.injury={gamesOut:Math.max(player.injury?.gamesOut||0,out),name:event.title,detail,ovrDrop:drop};
      if(drop>0) player.ovr=clamp((Number(player.ovr)||70)-drop,1,99);
      display.impact=`${out>0?`休战 ${out} 场`:'无需休战'}${drop>0?`，OVR -${drop}`:''}`;
      rebuildTeamStrengths();
    }
  }
  STATE.seasonEventsTriggered++;
  STATE.eventHistory.unshift(display);
  if(STATE.eventHistory.length>100) STATE.eventHistory.length=100;
  addNews(`${display.target}：${display.title}`,`${display.detail}。${display.impact}`,'突发事件');
  return display;
}
function advanceInjuriesOneGame(){
  if(STATE.userInjury.gamesOut>0) STATE.userInjury.gamesOut--;
  ALL_TEAMS.forEach(team=>{
    (STATE.teamRosters[team]||[]).forEach(p=>{
      if(p.injury && p.injury.gamesOut>0){
        p.injury.gamesOut--;
        if(p.injury.gamesOut<=0) p.injury=null;
      }
    });
  });
}
function currentUserAvailable(){return !STATE.userInjury || STATE.userInjury.gamesOut<=0;}

/* =========================
   核心模拟函数 (可单独调用)
========================= */
function _simulateOneGame() {
  // 本场开打前，player.injury.gamesOut>0 即视为缺席；本场结束后再扣除一场。
  const others = ALL_TEAMS.filter(t=>t!==STATE.userTeam);
  const opp = pick(others);
  const userAvailable=currentUserAvailable();
  const user = userAvailable ? generateUserGameStats() : {pts:0,reb:0,ast:0,stl:0,blk:0};
  const userStrength=teamGameStrength(STATE.userTeam);
  const oppStrength=teamGameStrength(opp);
  const oppScore = rand(90,118)+(oppStrength-80)*.52;
  let teamScore = rand(92,116)+(userStrength-80)*.58+(userAvailable?user.pts*.15:0);
  const win = teamScore >= oppScore;
  STATE.gamesPlayed++;
  if(userAvailable){
    STATE.seasonStats.gp++;
    ['pts','reb','ast','stl','blk'].forEach(k=>STATE.seasonStats[k]=+(STATE.seasonStats[k]+user[k]).toFixed(1));
    STATE.careerStats.gp++;
    STATE.careerStats.pts += user.pts;
    STATE.careerStats.reb += user.reb;
    STATE.careerStats.ast += user.ast;
    STATE.careerStats.stl += user.stl;
    STATE.careerStats.blk += user.blk;
  }
  // 先结算既有伤病的1场缺席，再生成本场的新事件；新伤病从下一场开始计时。
  advanceInjuriesOneGame();
  const event=triggerRandomGameEvent();
  // ★ 添加：检测爆炸数据并写入事件播报
  if (userAvailable) {
    maybeAddExplosiveEvent(user, opp, {win});
  }
  if(!STATE.gameLog)STATE.gameLog=[];
  STATE.gameLog.unshift({game:STATE.gamesPlayed,opponent:opp,win,score:`${Math.round(teamScore)}-${Math.round(oppScore)}`,stats:user,userAvailable,event});
  const grade = userAvailable ? clamp(Math.round(6+(user.pts+user.ast+user.reb)/10+(win?1.2:0)),6,10) : 0;
  return {win,userStats:user,grade,score:`${Math.round(teamScore)}-${Math.round(oppScore)}`,opponent:opp,event,userAvailable};
}

function runPreseasonMarketSimulation(){
  STATE.tradeHistory=[];
  normalizeRosters();

  // AI休赛期签约/转会：必须真正修改 teamRosters，而不能只生成新闻。
  // 每次交易都先从原球队删除球员，再加入新球队，保证一名球员只存在于一个球队。
  const count=rint(3,5), usedPlayers=new Set(), usedPairs=new Set();
  for(let n=0;n<count;n++){
    let tries=0,done=false;
    while(tries++<80&&!done){
      const from=pick(ALL_TEAMS);
      const to=pick(ALL_TEAMS);
      if(from===to) continue;
      const pair=from+'|'+to;
      if(usedPairs.has(pair)||usedPairs.has(to+'|'+from)) continue;

      const source=STATE.teamRosters[from]||[];
      // 优先挑选真实球员，避免重复制造同名球员。
      const candidates=source.filter(p=>!p.isUser && !usedPlayers.has(p.id));
      if(!candidates.length) continue;

      // 强队核心也可能转会，但整体以高质量轮换为主。
      const sorted=[...candidates].sort((a,b)=>b.ovr-a.ovr);
      const topPool=sorted.slice(0,Math.min(5,sorted.length));
      const player=pick(topPool);
      const oldIndex=source.findIndex(p=>p.id===player.id);
      if(oldIndex<0) continue;

      if(!Array.isArray(STATE.teamRosters[to])) STATE.teamRosters[to]=[];
      // 当前游戏每队初始10人；限制到15人，避免无限堆积。
      if(STATE.teamRosters[to].length>=15) continue;

      // 正式执行转会：原队移除 + 新队加入。
      const moved={...player, role:'主要轮换'};
      STATE.teamRosters[from].splice(oldIndex,1);
      STATE.teamRosters[to].push(moved);

      const salary=moved.salary||salaryForOVR(moved.ovr);
      const years=rint(2,4);
      STATE.tradeHistory.push({
        type:'签约',
        title:`${to} 宣布重磅签约`,
        desc:`${moved.name}（OVR ${moved.ovr}）离开 ${from}，正式加盟 ${to}，签下${formatContract(years,salary)}合同（年薪${formatSalary(salary)}）。`,
        from,to,
        sent:{name:moved.name,pos:moved.pos,ovr:moved.ovr},
        received:{name:'合同',pos:'',ovr:salary},
        gradeA:'A',gradeB:'A'
      });
      usedPlayers.add(moved.id);
      usedPairs.add(pair);
      done=true;
    }
  }

  // 再做一次全联盟阵容整理，防止历史存档残留重复球员。
  normalizeRosters();
  rebuildTeamStrengths();
}
function simulateStandings(){
  const userWins = (STATE.gameLog||[]).filter(g=>g.win).length;
  const wins = {};

  // 核心算法：球队实力决定预期胜率，随机波动只做小幅修正。
  // 使用 Logistic 曲线，让实力差距在高水平区间也能明显反映到胜场。
  const nonUserTeams = ALL_TEAMS.filter(t=>t!==STATE.userTeam);
  const strengthList = ALL_TEAMS.map(t=>STATE.teamStrengths[t] || BASE[t] || 78);
  const leagueMean = strengthList.reduce((a,b)=>a+b,0) / strengthList.length;

  const strengthToWins = (strength) => {
    const pct = 1 / (1 + Math.exp(-(strength - leagueMean) / 3.6));
    return 82 * pct;
  };

  // 先生成连续的“实力预期胜场”。越接近联盟平均实力，越接近 41 胜。
  const expected = {};
  ALL_TEAMS.forEach(t=>{
    const strength = STATE.teamStrengths[t] || BASE[t] || 78;
    expected[t] = strengthToWins(strength);
  });

  // 用户球队的真实胜负记录优先使用实际比赛结果。
  wins[STATE.userTeam] = clamp(userWins, 0, 82);

  // 其余球队加入少量赛季随机性（约±3胜），而不是之前的±4后再整体缩放。
  nonUserTeams.forEach(t=>{
    const strength = STATE.teamStrengths[t] || BASE[t] || 78;
    const expectedWins = expected[t];
    let w = Math.round(expectedWins + rand(-2.8, 2.8));

    // 强队保留明显优势，但避免极端到不合理。
    if(strength >= leagueMean + 7) w += rint(0,2);
    if(strength <= leagueMean - 7) w -= rint(0,2);
    wins[t] = clamp(w, 15, 67);
  });

  // NBA 30 队完整赛季总胜场必须为 1230。
  // 这里只做“加减胜场”校正，不再乘比例，因此球队间原本的强弱排序不会被压扁。
  const targetNonUser = 1230 - wins[STATE.userTeam];
  let diff = targetNonUser - nonUserTeams.reduce((sum,t)=>sum+wins[t],0);

  // 优先给预期胜场更高的球队加胜场，优先从预期胜场更低的球队减胜场，
  // 这样总量修正仍然尽量符合实力逻辑。
  const addOrder = [...nonUserTeams].sort((a,b)=>expected[b]-expected[a]);
  const removeOrder = [...nonUserTeams].sort((a,b)=>expected[a]-expected[b]);
  let safety = 0;
  while(diff !== 0 && safety++ < 5000){
    const order = diff > 0 ? addOrder : removeOrder;
    let changed = false;
    for(const t of order){
      if(diff === 0) break;
      if(diff > 0 && wins[t] < 67){ wins[t]++; diff--; changed=true; }
      else if(diff < 0 && wins[t] > 15){ wins[t]--; diff++; changed=true; }
    }
    if(!changed) break;
  }

  const make = (list, conf) => list.map(t=>({
    name: t,
    strength: STATE.teamStrengths[t] || BASE[t],
    wins: wins[t],
    losses: 82-wins[t],
    expectedWins: +expected[t].toFixed(1),
    conference: conf
  })).sort((a,b)=>b.wins-a.wins || b.strength-a.strength);

  STATE.standing = {
    east: make(EAST, 'East'),
    west: make(WEST, 'West')
  };
  runPlayIn();
}

   const g1=oneGame(a,b),g2=oneGame(c,d),g3=oneGame(g1.loser,g2.winner);
   res[k]={seed7Winner:g1.winner,seed8Winner:g3.winner,logs:[`7号 vs 8号：${g1.winner.name} 获胜，锁定7号种子。`,`9号 vs 10号：${g2.winner.name} 获胜。`,`最终8号争夺：${g3.winner.name} 获得8号种子。`]};
 });

function fakeSeasonLine(p){
 const prof=REALISTIC_DEF_PROFILES[p.name]||{};
 const attrs=p.attrs||{};
 const getAttr=(key,fallback)=>Number.isFinite(Number(attrs[key]))?Number(attrs[key]):fallback;
 const astBase=getAttr('助攻',p.ovr)/9.8;

 return `<div><div class="text-center mb-4"><h2 class="text-xl font-black">📰 ${STATE.seasonYear}-${String(STATE.seasonYear+1).slice(2)} 休赛期动态</h2></div><div class="space-y-3 max-h-[50vh] overflow-y-auto">${trades.map((t,i)=>`<div class="news-card p-4 rounded-xl border border-orange-200 bg-orange-50/40"><div class="flex justify-between text-[10px] text-orange-600 font-bold"><span>🔥 签约</span><span>${STATE.seasonYear}夏</span></div><div class="font-black text-sm mt-1">${t.title}</div><div class="text-xs mt-2 text-slate-700">${t.desc}</div></div>`).join('')}</div><button onclick="STATE.step='dashboard';STATE.seasonPhase='regular';render();" class="w-full mt-4 bg-orange-600 text-white font-bold py-3.5 rounded-xl">🏀 开启新赛季</button></div>`;
}

function getPositionLegacyRank(score,pos){
 const benchmarks={
  PG:[['魔术师约翰逊',100],['斯蒂芬·库里',94],['奥斯卡·罗伯特森',89],['埃尔文·汤姆·弗雷泽',78],['以赛亚·托马斯',76],['克里斯·保罗',73],['约翰·斯托克顿',72],['杰森·基德',68],['拉塞尔·威斯布鲁克',66],['史蒂夫·纳什',65],['达米安·利拉德',60],['托尼·帕克',55]],
  SG:[['迈克尔·乔丹',105],['科比·布莱恩特',94],['杰里·韦斯特',84],['德怀恩·韦德',79],['詹姆斯·哈登',76],['阿伦·艾弗森',74],['克莱德·德雷克斯勒',72],['雷·阿伦',61],['雷吉·米勒',60],['文斯·卡特',58]],
  SF:[['勒布朗·詹姆斯',108],['拉里·伯德',98],['凯文·杜兰特',91],['朱利叶斯·欧文',87],['斯科蒂·皮蓬',74],['里克·巴里',72],['约翰·哈夫利切克',71],['科怀·莱昂纳德',70],['保罗·乔治',57],['卡梅隆·安东尼',56]],
  PF:[['蒂姆·邓肯',105],['卡尔·马龙',91],['凯文·加内特',88],['字母哥',86],['查尔斯·巴克利',82],['德克·诺维茨基',79],['鲍勃·佩蒂特',76],['卡尔·马龙',74],['克里斯·韦伯',62],['克里斯·波什',55]],
  C:[['卡里姆·阿卜杜尔·贾巴尔',110],['比尔·拉塞尔',104],['威尔特·张伯伦',102],['沙奎尔·奥尼尔',93],['哈基姆·奥拉朱旺',90],['尼古拉·约基奇',88],['摩西·马龙',84],['大卫·罗宾逊',79],['帕特里克·尤因',72],['大卫·罗宾逊',70],['德怀特·霍华德',61]]
 };
 const list=benchmarks[pos]||benchmarks.PG;
 const higher=list.filter(x=>score < x[1]).length;
 const rank=higher+1;
 const maxRank=list.length+1;
 if(rank<=maxRank-1) return `同位置历史第${rank}位左右`;
 return `同位置历史第${maxRank}位以后`;
}

function getHistoricalLegacy(){
 const c=STATE.careerStats||{};
 const gp=Number(c.gp||0), rings=Number(c.rings||0), mvps=Number(c.mvps||0), dpoys=Number(c.dpoys||0), fmvp=Number(c.finalsMvps||0), allNba=Number(c.allNba||0), allDef=Number(c.allDef||0), roys=Number(c.roys||0);
 const ppg=gp?c.pts/gp:0, rpg=gp?c.reb/gp:0, apg=gp?c.ast/gp:0;
 const longevity=Math.min(18, gp/260);
 const production=Math.min(18, ppg*0.48+rpg*0.28+apg*0.34);
 const accolades=mvps*7+fmvp*5+rings*4+dpoys*4+allNba*1.7+allDef*1.1+roys*0.8;
 const score=longevity+production+accolades;
 let tier, range, verdict, grade;
 if(score>=78||mvps>=5||fmvp>=4||allNba>=14){tier='NBA历史前十级别';range='历史第5～10位区间';grade='传奇中的传奇';}
 else if(score>=62||mvps>=3||fmvp>=3||allNba>=10){tier='NBA历史前20级别';range='历史第11～20位区间';grade='历史超巨';}
 else if(score>=48||mvps>=2||allNba>=7){tier='NBA历史前35级别';range='历史第21～35位区间';grade='超级巨星';}
 else if(score>=35||mvps>=1||allNba>=4||rings>=2){tier='NBA历史前60级别';range='历史第36～60位区间';grade='巨星';}
 else if(score>=23||allNba>=2||rings>=1){tier='NBA历史前100级别';range='历史第61～100位区间';grade='明星球员/名人堂级';}
 else {tier='NBA历史重要球员';range='历史100名以后';grade='优秀球员';}
 const strengths=[];
 if(mvps>=1) strengths.push(`${mvps}次MVP`);
 if(fmvp>=1) strengths.push(`${fmvp}次FMVP`);
 if(rings>=1) strengths.push(`${rings}枚总冠军`);
 if(allNba>=1) strengths.push(`${allNba}次最佳阵容`);
 if(allDef>=1) strengths.push(`${allDef}次防守阵容`);
 if(gp>=700) strengths.push('超长职业生涯');
 if(!strengths.length) strengths.push('稳定的长期职业表现');
 let evalText;
 if(score>=78||mvps>=5||allNba>=14){evalText='他不仅拥有顶级巅峰，还具备极强的长期统治力与荣誉积累。放在NBA历史坐标中，属于改变时代的超级传奇，历史地位主要由巅峰高度、冠军与个人荣誉共同支撑。';}
 else if(score>=62||mvps>=3||allNba>=10){evalText='他的职业生涯已经明显超越普通巨星范畴，拥有足够的巅峰高度和荣誉厚度。历史评价通常会把他视为一个时代最具代表性的球员之一。';}
 else if(score>=48||mvps>=2||allNba>=7){evalText='他的巅峰表现和累计荣誉都达到了超级巨星水平。虽然距离历史最顶层还存在一些差距，但已经属于NBA历史上非常有分量的球员。';}
 else if(score>=35||mvps>=1||allNba>=4||rings>=2){evalText='他拥有足够出色的个人表现和荣誉履历，能够在NBA历史长河中留下清晰印记，属于名人堂级别的巨星。';}
 else if(score>=23||allNba>=2||rings>=1){evalText='他是一名有代表性的高水平球员，拥有值得被历史记住的赛季与荣誉，但距离历史超巨层级仍有明显差距。';}
 else {evalText='他的职业生涯具备一定影响力，但从历史荣誉、巅峰高度和长期积累来看，尚未进入历史最顶级球员行列。';}
 return {tier,range,grade,score:score.toFixed(1),strengths:strengths.join('、'),evalText,ppg:ppg.toFixed(1),rpg:rpg.toFixed(1),apg:apg.toFixed(1),posRank:getPositionLegacyRank(score,STATE.position),posName:posText(STATE.position)};
}

function retireCareer(){STATE.step='retired';render();}
function renderRetired(){
 const c=STATE.careerStats, h=getHistoricalLegacy();
 return `<div class="text-center py-5"><h2 class="text-xl font-black">🏛️ 传奇落幕</h2><p class="text-xs text-slate-500 mt-2">${STATE.playerName} 在${STATE.age}岁退役，共${STATE.careerSeason}赛季。</p>
 <div class="grid grid-cols-2 gap-2 mt-5 text-left p-4 bg-slate-50 border rounded-xl text-xs"><div>出场：<b>${c.gp}</b></div><div>得分：<b>${Math.round(c.pts)}</b></div><div>篮板：<b>${Math.round(c.reb)}</b></div><div>助攻：<b>${Math.round(c.ast)}</b></div><div>抢断：<b>${Math.round(c.stl)}</b></div><div>盖帽：<b>${Math.round(c.blk)}</b></div><div>总冠军：<b>${c.rings}</b></div><div>MVP：<b>${c.mvps}</b></div><div>FMVP：<b>${c.finalsMvps}</b></div><div>DPOY：<b>${c.dpoys}</b></div><div>最佳阵容：<b>${c.allNba||0}</b></div><div>防守阵容：<b>${c.allDef||0}</b></div></div>
 <div class="mt-4 p-4 rounded-xl border border-orange-200 bg-orange-50 text-left"><div class="font-black text-base">👑 NBA历史地位评价</div><div class="mt-3 grid grid-cols-2 gap-2 text-xs"><div class="bg-white/70 rounded-lg p-2"><span class="text-slate-500">历史档位</span><br><b>${h.tier}</b></div><div class="bg-white/70 rounded-lg p-2"><span class="text-slate-500">历史排名区间</span><br><b>${h.range}</b></div><div class="bg-white/70 rounded-lg p-2"><span class="text-slate-500">生涯评价</span><br><b>${h.grade}</b></div><div class="bg-white/70 rounded-lg p-2"><span class="text-slate-500">同位置历史地位</span><br><b>${h.posName}：${h.posRank}</b></div><div class="bg-white/70 rounded-lg p-2"><span class="text-slate-500">生涯场均</span><br><b>${h.ppg}分 · ${h.rpg}板 · ${h.apg}助</b></div></div><div class="mt-3 text-xs leading-6 text-slate-700">${h.evalText}</div><div class="mt-2 text-[11px] text-orange-700">主要依据：${h.strengths}</div></div>
 <p class="text-[10px] text-slate-400 mt-3">历史地位为游戏内基于生涯数据、巅峰表现、冠军与个人荣誉自动生成，并非现实NBA官方排名。</p>
 <button onclick="resetGame()" class="w-full mt-5 bg-orange-600 text-white font-bold py-3 rounded-xl">🔄 新生涯</button></div>`;
}
